{% extends "base.html" %}

{% block title %}README{% endblock %}

{% block extra_head %}
<style>
	.readme-container {
		max-width: 860px;
		margin: 0 auto;
		background: #fff;
		border: 1px solid #e0e0e0;
		border-radius: 6px;
		padding: 2rem 2.5rem;
	}
	.readme-container h1,
	.readme-container h2,
	.readme-container h3 {
		margin-top: 1.4em;
		margin-bottom: .5em;
	}
	.readme-container pre {
		background: #f5f5f5;
		border: 1px solid #e0e0e0;
		border-radius: 4px;
		padding: .8rem 1rem;
		overflow-x: auto;
	}
	.readme-container code {
		font-size: .88em;
	}
	.readme-container table {
		border-collapse: collapse;
		width: 100%;
		margin: 1em 0;
	}
	.readme-container th,
	.readme-container td {
		border: 1px solid #ddd;
		padding: .4rem .6rem;
		text-align: left;
	}
	.readme-container th {
		background: #f5f5f5;
	}
	.readme-container img {
		max-width: 100%;
	}
	.readme-empty {
		color: #888;
		font-style: italic;
	}
</style>
{% endblock %}

{% block content %}
<div class="readme-container">
	{% if readme_html %}
		{{ readme_html }}
	{% else %}
		<p class="readme-empty">README.md is empty.</p>
	{% endif %}
</div>
{% endblock %}
