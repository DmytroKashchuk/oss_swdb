<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{% block title %}Open Source Classification{% endblock %}</title>

		<!-- Bootstrap 5 -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>

		<!-- Tabulator -->
		<link
			href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_simple.min.css"
			rel="stylesheet"
		/>

		<style>
			body {
				background-color: #f7f7fb;
			}
			.page-wrapper {
				padding: 2rem 1rem 3rem;
			}
			.navbar-brand {
				font-weight: 600;
			}
		</style>

		{% block extra_head %}{% endblock %}
	</head>

	<body>
		<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
			<div class="container-fluid">
				<a class="navbar-brand" href="{{ url_for('index') }}">Open Source Browser</a>
				<ul class="navbar-nav ms-auto">
					<li class="nav-item">
						<a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">Classification</a>
					</li>
					<li class="nav-item">
						<a class="nav-link {% if request.endpoint == 'main_data' %}active{% endif %}" href="{{ url_for('main_data') }}">Main Data</a>
					</li>
					<li class="nav-item">
						<a class="nav-link {% if request.endpoint == 'universe' %}active{% endif %}" href="{{ url_for('universe') }}">Universe Installs</a>
					</li>
					<li class="nav-item">
						<a class="nav-link {% if request.endpoint == 'grype' %}active{% endif %}" href="{{ url_for('grype') }}">Grype</a>
					</li>
					<li class="nav-item">
						<a class="nav-link {% if request.endpoint == 'readme' %}active{% endif %}" href="{{ url_for('readme') }}">README</a>
					</li>
				</ul>
			</div>
		</nav>

		<div class="page-wrapper">
			{% block content %}{% endblock %}
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
		{% block extra_scripts %}{% endblock %}
	</body>
</html>
